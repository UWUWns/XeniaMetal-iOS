name: XeniaMetal
options:
  bundleIdPrefix: dev.xeniaresearch
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    ENABLE_PREVIEWS: "YES"
targets:
  XeniaMetal:
    type: application
    platform: iOS
    sources:
      - path: XeniaMetal
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.xeniaresearch.XeniaMetal
        PRODUCT_NAME: XeniaMetal
        INFOPLIST_KEY_CFBundleDisplayName: XeniaMetal
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.games
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_EMIT_LOC_STRINGS: YES
    dependencies: []
